# Builds the customer website (no admin panel) as static pages and publishes it to GitHub Pages
# on every push to main, so the QR code always opens the latest version.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:css
      - name: Build static site
        run: node scripts/build-static.js
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # optional: URL of the deployed backend (e.g. Railway) that should receive the forms
          STATIC_API_URL: ${{ vars.STATIC_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
